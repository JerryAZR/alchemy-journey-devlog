# Devlog 002 — The Split（前后端拆分：边界、黑盒、四轮交锋）
# 旁白稿：Jerry 亲笔（2026-10），助手切行/对轴。行 = 一条配音 = 画面锚点。

# ── 书接上回：读代码发现缺陷 ──────────────────────────────
[[lines]]
id = "open.hook"
text = "书接上回。验收过 AI 给出的游戏行为符合预期，下一步，就是看看代码质量。"

[[lines]]
id = "open.habit"
text = "我习惯从后端流程控制开始，所以打开了 src/combat/mod.rs，找回合循环的逻辑。"

[[lines]]
id = "open.scan"
text = "快速扫一遍，战斗逻辑主要是围绕 CombatState 这个类型开发的。它的内容和子项规划是否合理，我们先不讨论，优先关注整体流程和结构。"

[[lines]]
id = "open.missing"
text = "我看到 AI 为 CombatState 实现了 end_player_turn 和 run_enemy_turn，是回合控制相关的逻辑。不过，为什么没有类似 start_player_turn 这样的玩家回合初始化？"

[[lines]]
id = "open.guess"
text = "可能是 AI 把抽牌做进了战斗初始化和 run_enemy_turn 之后，认为没有必要再做 start_player_turn。这个混乱的包装，感觉会是个问题，之后要跟 AI 提一下。"

[[lines]]
id = "open.usage"
text = "与此同时我还有个疑惑：这几个函数是在哪里用的？文件里除了定义就是测试，没找到使用。"

[[lines]]
id = "open.answer"
text = "问了下 AI 才知道，这几个函数直接交给 UI 层使用，游戏进程也是 UI 直接控制。"

[[lines]]
id = "open.sts"
text = "这可不行。杀戮尖塔从一代开始就一直被调侃“动画大于一切”，也就是游戏核心逻辑与前端耦合，我们不应该再踩相同的坑。"

[[lines]]
id = "open.severity"
text = "相比于之前发现的其它几个问题，这个明显更严重：它是架构层的缺陷，涉及多个模块。还好发现得早。"

[[lines]]
id = "open.task"
text = "也就是说，我们的下一个任务，是前后端的拆分。"

# ── 拆分思路 ─────────────────────────────────────────────
[[lines]]
id = "split.ecs"
text = "Bevy 的 ECS 架构对回合制游戏没什么帮助，事件本来就是顺序发生的。这也意味着，我们的拆分可以做得很干净。"

[[lines]]
id = "split.core"
text = "后端核心可以完全不依赖 Bevy，用纯净的 Rust 写成：核心收集排好序、验证过的玩家动作，返回游戏状态更新，就这么简单。"

[[lines]]
id = "split.boundary"
text = "不需要考虑玩家动作是怎么产生的，也不需要考虑结果要怎么展示、动画要播多久。"

# ── AI 品味论（为什么必须文档先行）────────────────────────
[[lines]]
id = "taste.linter"
text = "根据我的经验，AI 擅长写出能跑的代码：正确缩进、命名清晰、风格一致，这些 Linter 能查的部分，也都做得非常漂亮。"

[[lines]]
id = "taste.taste"
text = "但诸如结构简单精巧、意图清晰、模块划分准确这些老工程师的“品味”，往往会被忽略掉。"

[[lines]]
id = "taste.mountain"
text = "另一方面，AI 读代码的能力比人类可强太多了。人类工程师觉得“受不了、必须重构”的屎山，AI 可能觉得“还好”，然后在上面继续开发。"

[[lines]]
id = "taste.toolate"
text = "久而久之，当 AI 也觉得“不太行”的时候，已经没有人能救了。"

[[lines]]
id = "taste.doc"
text = "所以我现在跟 AI 合作开发，都会先要求架构文档。特定功能的实现细节可以随时改，架构问题的影响范围，可就大了。"

# ── 交锋一：advance() 泵 ─────────────────────────────────
[[lines]]
id = "r1.proposal"
text = "第一轮。AI 的方案是给核心加一个 advance()，让调用方按自己的节奏泵它，比如 UI 拿定时器调。听起来挺合理：调用方管节奏，核心管决策。"

[[lines]]
id = "r1.inertia"
text = "但这是典型的惯性思维——它没能跳出自己刚造成的模式：虽然决策层确实移到了后端，但驱动还是前端在做。"

[[lines]]
id = "r1.question"
text = "诸位请想：如果事件的顺序确定，早点或者晚点处理这些事件，有任何区别吗？反正都要处理，为什么不直接处理好，再返回最终状态？"

[[lines]]
id = "r1.sync"
text = "于是核心改成同步全解析：一个动作进来，所有后果——抽牌、弃牌、敌方回合、下回合开始——全部算完，按顺序吐出事件流，然后休息，等下一个输入。"

[[lines]]
id = "r1.frontend"
text = "动画和节奏，是前端看着事件流自己安排的事，核心一概不管。"

# ── 交锋二：连接即身份 ───────────────────────────────────
[[lines]]
id = "r2.mp"
text = "第二轮，我们开始探讨多人合作的架构。多人游戏的一个关键点是：未必要一开始就完整支持多人游玩，但一定要一开始就想到“可能会有多位玩家”。"

[[lines]]
id = "r2.assume"
text = "不能让“只有一个玩家”的假设溜进系统。这种假设引发的问题，在单人测试时发现不了，但一旦加入多人支持就会暴露，视情况可能还需要大幅度的重构。"

[[lines]]
id = "r2.id"
text = "具体到这个游戏，“玩家动作”需要带上玩家的识别符。拿什么做识别符？"

[[lines]]
id = "r2.proposal"
text = "AI 提议服务器直接从网络连接推导玩家身份，理由是“安全考量”，说是防身份伪造。"

[[lines]]
id = "r2.question"
text = "我就问它：你预期的“恶意攻击者”是谁？会怎么攻击？这只是和朋友一起玩的合作游戏，以后甚至想开放 mod，或者本地多人玩法。"

[[lines]]
id = "r2.cliche"
text = "这就是典型的 AI 安全思维：它懂得“安全八股文”，但只会机械式地在触发关键词——例如“网络”——时应用，不审安全命题本身。"

[[lines]]
id = "r2.checklist"
text = "预期的攻击是什么？防御的边界在哪里？假想的攻击场景存在吗？付出的代价值得吗？"

[[lines]]
id = "r2.excuse"
text = "被问住后，它又换了一套说辞：“我们不防攻击者，只防客户端 bug。”这就更有意思了——但看理由本身的分量，它甚至还不如之前的“安全考量”。"

[[lines]]
id = "r2.inertia"
text = "客户端也是我们写的，如果有 bug 就该修，为什么要围绕假想 bug 设计协议？这也是 AI 惯性思维的典型体现：理由被攻破后，倾向于换个理由继续维护原提案，而不是重新构思。"

# ── 交锋三：广播事件流 vs lockstep ───────────────────────
[[lines]]
id = "r3.context"
text = "第三轮。我们刚刚解决了“主机收到的事件长什么样”，下一个问题是：如何保证每个参与者拿到同样的结果？"

[[lines]]
id = "r3.proposal"
text = "AI 的方案是：host 整合 guest 发来的玩家动作后，算出一段完整自包含的事件流，连随机数都提前揉进去，广播出去，其他人机械应用。"

[[lines]]
id = "r3.verdict"
text = "功能上虽然没有错，但我认为这是过度解读“主机权威”——它忽略了哪些事件本来就是确定的。"

[[lines]]
id = "r3.lockstep"
text = "我的反案简单得多：lockstep。线上只传排好序、被批准的动作，一个意图一个动作。"

[[lines]]
id = "r3.seeds"
text = "随机种子开局广播一次，之后每台机器用相同的引擎、相同的种子、相同的动作流，各自在本地展开所有后果，也能够达成一致。"

[[lines]]
id = "r3.benefits"
text = "这个方案，一方面网络上跑的数据更少，另一方面，主机和客机也能复用大多数的代码。"

# ── 交锋四：一刀切禁令 ───────────────────────────────────
[[lines]]
id = "r4.context"
text = "第四轮。既然决定用 lockstep，各参与者自主处理事件流，那么要保证可复现性，编码时也有些规则要遵守。"

[[lines]]
id = "r4.ban"
text = "列确定性约束时，AI 把浮点数和哈希容器一刀切全禁了。"

[[lines]]
id = "r4.training"
text = "在 AI 的训练数据里，浮点、哈希容器、随机数往往和“不稳定”相关。一旦系统要求确定性，比如多人同步，它就极端保守地一律禁用，而不是去想怎么正确、稳定地使用这些工具。"

[[lines]]
id = "r4.float"
text = "实际上，IEEE 浮点的基本运算就是确定的：同样的输入、同样的操作序列，永远同样的结果，否则是浮点规范本身违约。真正的雷区只有超越函数——各平台的数学库不保证逐位一致。"

[[lines]]
id = "r4.hash"
text = "哈希容器也一样，按键访问毫无问题。真正的约束只有一条：迭代顺序不能影响结果。"

# ── 是非题探针 ───────────────────────────────────────────
[[lines]]
id = "probe.question"
text = "主要设计决定之后，我问 AI：“不碰 UI、不让测试台帮忙维护任何游戏状态，你能纯程序化地开完一整局吗？”"

[[lines]]
id = "probe.reveal"
text = "这暴露出一个 AI 藏起来的问题：后端不知道自己的状态转移图。"

[[lines]]
id = "probe.expectation"
text = "按照我一开始的设想，既然前后端分开，后端必然应该知道所有状态间的转换，这应该属于第一轮讨论的一部分。"

[[lines]]
id = "probe.pretend"
text = "看来，AI 原本并没有消化第一轮的讨论，却假装自己理解了。"

# ── 战果 ─────────────────────────────────────────────────
[[lines]]
id = "result.boundary"
text = "拆分完成后，前后端的界限在代码中变得清晰可见，对后端的自动化测试也有了天然的接口。"

[[lines]]
id = "result.combatstate"
text = "然后，我们还把 CombatState 重做了一下。原本的设计假设了单一玩家、单一敌人，也没有对战斗内外的状态做出区分，这些在重构中都修复了。"

[[lines]]
id = "result.same"
text = "最后上手测试，玩家可见的部分和之前相比没有任何变化，测试通过。"

# ── 钩子 ─────────────────────────────────────────────────
[[lines]]
id = "outro.next"
text = "下一集，我们会在这套重构过的基础上继续开发，给玩家的卡牌加上实际的效果。"
